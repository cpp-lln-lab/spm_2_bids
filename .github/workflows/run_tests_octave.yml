---
name: tests_octave

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - main
  pull_request:
    branches: ['*']

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - name: Install dependencies
      run: |
        sudo apt-get -y -qq update
        sudo apt-get -y install octave octave-dev

    - name: Clone spm_2_bids
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 2

    - name: get bids-matlab and JSONio
      run: make install_dev_octave

    - name: Install MOxUnit and MOcov
      run: |
        git clone https://github.com/MOxUnit/MOxUnit.git --depth 1
        git clone https://github.com/MOcov/MOcov.git --depth 1

    # run the tests with the octave installed on the runner:
    # the JSONio mex file is compiled against it
    - name: Run tests
      run: |
        octave --no-gui --no-window-system --eval " \
          addpath(fullfile(pwd, 'MOcov', 'MOcov')); \
          addpath(fullfile(pwd, 'MOxUnit', 'MOxUnit')); \
          moxunit_set_path(); \
          init_spm_2_bids(); \
          run_tests;"

    - name: Code coverage
      uses: codecov/codecov-action@v7
      with:
        file: coverage.xml
        flags: ubuntu-latest_octave
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
